<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Accordion Tutor Preview</title>
    <style>
      :root { color: #1f2623; background: #f7f6f2; font-family: Inter, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 16px; }
      button, .file-picker { border: 1px solid #2f5f65; background: #fff; color: #15383d; border-radius: 6px; min-height: 38px; padding: 0 12px; font: inherit; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; }
      button:hover, .file-picker:hover { background: #e8f5f3; }
      button:disabled { cursor: not-allowed; opacity: .42; }
      input[type=file] { display: none; }
      .upload-panel, .beat-navigator, .beat-info { border: 1px solid #d8d8cf; background: #fffefb; border-radius: 8px; }
      .upload-panel { display: flex; justify-content: space-between; gap: 14px; padding: 14px 16px; align-items: center; }
      h1 { margin: 0 0 4px; font-size: 24px; letter-spacing: 0; }
      p { margin: 0; color: #59625d; }
      .upload-actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
      #saved-scores { height: 36px; padding: 0 10px; font-size: 13px; font-weight: 600; border-radius: 6px; border: 1px solid #bfc5bd; background: #fff; color: #2a3a2e; cursor: pointer; min-width: 160px; }
      #delete-score { height: 36px; width: 36px; padding: 0; font-size: 16px; font-weight: 700; border-radius: 6px; border: 1px solid #d4a0a0; background: #fff0f0; color: #a33; cursor: pointer; }
      #melody-part { height: 36px; padding: 0 10px; font-size: 13px; font-weight: 600; border-radius: 6px; border: 1px solid #bfc5bd; background: #fff; color: #2a3a2e; cursor: pointer; max-width: 220px; }
      .chord-entry { display: flex; align-items: center; gap: 10px; margin-top: 12px; padding: 10px 14px; border: 1px solid #d8d8cf; background: #fffefb; border-radius: 8px; }
      .chord-entry > label { font-size: 13px; font-weight: 700; color: #49524d; white-space: nowrap; }
      #chord-input { flex: 1; min-width: 0; height: 34px; padding: 0 10px; font: inherit; font-size: 13px; border: 1px solid #bfc5bd; border-radius: 6px; background: #fff; color: #2a3a2e; }
      .chord-entry button { height: 34px; }
      .chord-approx { color: #7a6a2a; font-weight: 700; margin-left: 6px; }
      .beat-navigator { display: grid; grid-template-columns: 118px minmax(180px, 1fr) 118px; gap: 12px; align-items: center; margin-top: 12px; padding: 10px; }
      .beat-position { display: flex; justify-content: center; align-items: baseline; gap: 12px; }
      .beat-position strong { font-size: 19px; }
      .main-grid { display: grid; grid-template-columns: 620px 1fr; gap: 14px; margin-top: 14px; align-items: start; }
      .left-column { display: flex; flex-direction: column; gap: 12px; }
      .score-panel { border: 1px solid #d8d8cf; background: #fffefb; border-radius: 8px; padding: 12px; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
      .score-panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
      .score-panel-header h2 { margin: 0; font-size: 18px; }
      #score-wrap { position: relative; overflow: auto; flex: 1; min-height: 0; border: 1px solid #e8e5dc; border-radius: 5px; background: #fff; }
      #score-osmd { width: 100%; position: relative; }
      #score-overlay { position: absolute; top: 0; left: 0; pointer-events: none; overflow: visible; }
      #score-highlight { position: absolute; pointer-events: none; background: rgba(218,165,32,0.38); border: 2px solid #b8860b; border-radius: 3px; display: none; z-index: 4; }
      .beat-overlay-btn { position: absolute; cursor: pointer; background: transparent; border: none; padding: 0; z-index: 3; pointer-events: all; }
      .beat-overlay-btn:hover { background: rgba(73,198,163,0.13); }
      #score-placeholder { color: #667069; padding: 20px 16px; margin: 0; }
      .beat-info { padding: 10px 12px; font-size: 13px; }
      .beat-info h3 { margin: 0 0 6px; font-size: 14px; font-weight: 800; color: #49524d; text-transform: uppercase; letter-spacing: .03em; }
      .beat-info dl { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; margin: 0; }
      .beat-info dl div { border-top: 1px solid #ebe8dd; padding-top: 6px; }
      .warnings-panel { padding: 8px 12px; border: 1px solid #e4bd5a; background: #fff4d7; border-radius: 8px; font-size: 12px; }
      .warnings-panel h4 { margin: 0 0 4px; font-size: 12px; font-weight: 800; }
      .warnings-panel ul { margin: 0; padding-left: 16px; }
      .warnings-panel li { margin: 2px 0; }
      .accordion-diagram { display: grid; grid-template-columns: 340px 96px 118px; justify-content: center; gap: 14px; min-height: 760px; padding: 18px; border-radius: 8px; background: linear-gradient(90deg, #263239, #354246 48%, #293136); border: 1px solid #1b2528; }
      .instrument-panel { background: #f8f8f2; border: 1px solid #bfc5bd; border-radius: 7px; padding: 10px; overflow: hidden; display: flex; justify-content: center; align-items: center; }
      .bellows { display: flex; flex-direction: column; justify-content: stretch; gap: 8px; padding: 4px 0; }
      .bellows span { flex: 1; background: #e7d9b9; border-left: 8px solid #b94d45; border-right: 8px solid #b94d45; clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%); }
      .accordion-diagram svg { width: 100%; max-height: 720px; }
      #score-osmd svg { display: block; max-height: none; }
      #bass { max-width: 310px; }
      #piano { max-width: 90px; }
      .piano-key { stroke: #111816; stroke-width: .8; }
      .piano-key-white { fill: #fffdf5; }
      .piano-key-black { fill: #1e2527; }
      .piano-key.is-active { fill: #ffcf4a; stroke: #8a5600; stroke-width: 1.8; }
      .key-label, .row-label { fill: #49524d; font-size: 7px; font-weight: 700; }
      .bass-button { fill: #ecefe7; stroke: #4d5651; stroke-width: 1.2; }
      .bass-button.is-active-bass  { fill: #49c6a3; stroke: #083d32; stroke-width: 2.2; }
      .bass-button.is-active-chord { fill: #ffd166; stroke: #7a4f00; stroke-width: 2.2; }
      .button-label { fill: #17201d; font-size: 7px; text-anchor: middle; pointer-events: none; font-weight: 800; }
      .button-label-suffix { font-size: 5px; font-weight: 800; }
      dl { display: grid; gap: 10px; margin: 12px 0 0; }
      dl div { border-top: 1px solid #ebe8dd; padding-top: 10px; }
      dt { color: #667069; font-size: 12px; font-weight: 800; text-transform: uppercase; }
      dd { margin: 3px 0 0; line-height: 1.4; }
      .warnings { margin-top: 16px; padding: 12px; border-radius: 7px; background: #fff4d7; border: 1px solid #e4bd5a; }
      .warnings h3 { margin: 0 0 8px; font-size: 15px; }
      .autoplay-bar { display: flex; align-items: center; gap: 14px; margin-top: 8px; padding: 10px 14px; border: 1px solid #d8d8cf; background: #fffefb; border-radius: 8px; flex-wrap: wrap; }
      .autoplay-bar #playbtn { min-width: 100px; font-size: 15px; }
      .autoplay-bar #playbtn.is-playing { background: #fff0f0; border-color: #c0392b; color: #7a1a10; }
      .bpm-group { display: flex; align-items: center; gap: 8px; }
      .bpm-group label { font-size: 13px; font-weight: 700; color: #49524d; }
      #bpmslider { width: 130px; accent-color: #2f5f65; cursor: pointer; }
      #bpmnum { width: 58px; padding: 0 6px; height: 36px; border: 1px solid #2f5f65; border-radius: 6px; font: inherit; font-size: 14px; text-align: center; }
      .beat-flash { display: inline-block; width: 14px; height: 14px; border-radius: 50%; background: transparent; border: 2px solid #bfc5bd; transition: background 0.05s; margin-left: 4px; }
      .beat-flash.strong { background: #ff6b4a; border-color: #c0392b; }
      .beat-flash.weak   { background: #ffd166; border-color: #a68200; }
      @media (max-width: 1100px) { .workspace-grid { grid-template-columns: 1fr; } .accordion-diagram { grid-template-columns: 264px 78px 92px; } }
      @media (max-width: 560px) { body { padding: 10px; } .upload-panel, .beat-navigator, .accordion-diagram { display: flex; flex-direction: column; } .bellows { display: none; } }
    </style>
  <script src="https://unpkg.com/opensheetmusicdisplay@1.9.2/build/opensheetmusicdisplay.min.js"></script>
  </head>
  <body>
    <main>
      <section class="upload-panel">
        <div>
          <h1>Accordion Tutor</h1>
          <p>Upload uncompressed MusicXML/XML scores, then step through them beat by beat.</p>
        </div>
        <div class="upload-actions">
          <label class="file-picker">Upload Score<input id="file" type="file" accept=".pdf,.musicxml,.xml,.mxl" /></label>
          <button id="sample">Load Sample</button>
          <select id="saved-scores"><option value="">— Saved Scores —</option></select>
          <button id="delete-score" style="display:none" title="Delete selected saved score">✕</button>
          <select id="melody-part" style="display:none" title="Which MusicXML part holds the melody"></select>
        </div>
      </section>
      <section class="chord-entry">
        <label for="chord-input">Chords</label>
        <input id="chord-input" type="text" spellcheck="false" placeholder="Override by measure, one group per bar:  Am | Am | Dm E7 | Am   (use - to hold the previous chord)">
        <button id="chord-apply">Apply</button>
        <button id="chord-clear">Clear</button>
      </section>
      <section class="beat-navigator">
        <button id="prev">← Prev</button>
        <div class="beat-position"><span id="measure"></span><strong id="beat"></strong><span id="count"></span></div>
        <button id="next">Next →</button>
      </section>
      <div class="autoplay-bar">
        <button id="playbtn">▶ Play</button>
        <div class="bpm-group">
          <label for="bpmslider">BPM</label>
          <input id="bpmslider" type="range" min="20" max="200" value="80">
          <input id="bpmnum" type="number" min="20" max="200" value="80">
        </div>
        <span id="beat-flash" class="beat-flash" aria-hidden="true"></span>
        <label style="display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:#49524d;cursor:pointer;user-select:none">
          <input type="checkbox" id="notesound" style="width:15px;height:15px;accent-color:#2f5f65;cursor:pointer"> Note sound
        </label>
        <label style="display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:#49524d;cursor:pointer;user-select:none">
          <input type="checkbox" id="basssound" style="width:15px;height:15px;accent-color:#2f5f65;cursor:pointer"> Bass sound
        </label>
      </div>
      <div class="main-grid">
        <div class="left-column">
          <section class="accordion-diagram">
            <div class="instrument-panel"><svg id="bass" viewBox="-18 0 225 672"></svg></div>
            <div class="bellows"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
            <div class="instrument-panel"><svg id="piano" viewBox="0 0 54 528"></svg></div>
          </section>
          <aside class="beat-info" style="border:1px solid #d8d8cf;background:#fffefb;border-radius:8px;">
            <h3>Current Beat</h3>
            <dl id="info">
              <div><dt>Position</dt><dd id="info-position"></dd></div>
              <div><dt>Chord</dt><dd id="info-chord"></dd></div>
              <div><dt>Left Hand</dt><dd id="info-lefthand"></dd></div>
              <div><dt>Right Hand</dt><dd id="info-righthand"></dd></div>
            </dl>
          </aside>
          <div id="warnings"></div>
        </div>
        <section class="score-panel">
          <div class="score-panel-header"><h2>Score</h2><span id="score-position"></span></div>
          <div id="score-wrap">
            <div id="score-osmd"></div>
            <div id="score-overlay">
              <div id="score-highlight"></div>
            </div>
          </div>
          <p id="score-placeholder">Load a sample or upload a score to see it here.</p>
        </section>
      </div>
    </main>
    <script>
      // ── IndexedDB score storage ──
      function openScoreDB() {
        return new Promise((resolve, reject) => {
          const req = indexedDB.open("accordion-scores", 1);
          req.onupgradeneeded = () => {
            const db = req.result;
            if (!db.objectStoreNames.contains("scores")) {
              const store = db.createObjectStore("scores", { keyPath: "id", autoIncrement: true });
              store.createIndex("name", "name", { unique: false });
            }
          };
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        });
      }
      async function saveScore(name, xml) {
        const db = await openScoreDB();
        return new Promise((resolve, reject) => {
          const tx = db.transaction("scores", "readwrite");
          const store = tx.objectStore("scores");
          const idx = store.index("name");
          const lookup = idx.getAll(name);
          lookup.onsuccess = () => {
            const existing = lookup.result;
            if (existing.length) {
              existing[0].xml = xml;
              existing[0].savedAt = Date.now();
              store.put(existing[0]);
            } else {
              store.add({ name, xml, savedAt: Date.now() });
            }
          };
          tx.oncomplete = () => { db.close(); resolve(); };
          tx.onerror = () => { db.close(); reject(tx.error); };
        });
      }
      async function listScores() {
        const db = await openScoreDB();
        return new Promise((resolve, reject) => {
          const tx = db.transaction("scores", "readonly");
          const req = tx.objectStore("scores").getAll();
          req.onsuccess = () => {
            db.close();
            resolve(req.result.map(r => ({ id: r.id, name: r.name, savedAt: r.savedAt })));
          };
          req.onerror = () => { db.close(); reject(req.error); };
        });
      }
      async function loadScore(id) {
        const db = await openScoreDB();
        return new Promise((resolve, reject) => {
          const tx = db.transaction("scores", "readonly");
          const req = tx.objectStore("scores").get(id);
          req.onsuccess = () => { db.close(); resolve(req.result); };
          req.onerror = () => { db.close(); reject(req.error); };
        });
      }
      async function deleteScore(id) {
        const db = await openScoreDB();
        return new Promise((resolve, reject) => {
          const tx = db.transaction("scores", "readwrite");
          tx.objectStore("scores").delete(id);
          tx.oncomplete = () => { db.close(); resolve(); };
          tx.onerror = () => { db.close(); reject(tx.error); };
        });
      }
      async function populateSavedScores() {
        const sel = $("saved-scores");
        const scores = await listScores();
        sel.innerHTML = '<option value="">— Saved Scores —</option>';
        scores.sort((a, b) => b.savedAt - a.savedAt).forEach(s => {
          const opt = document.createElement("option");
          opt.value = s.id;
          opt.textContent = s.name;
          sel.appendChild(opt);
        });
        $("delete-score").style.display = "none";
      }

      const DEBUG = /[?&]debug=1/.test(location.search);
      const NOTE_SEMITONES = { C:0,"C#":1,Db:1,D:2,"D#":3,Eb:3,E:4,F:5,"F#":6,Gb:6,G:7,"G#":8,Ab:8,A:9,"A#":10,Bb:10,B:11,Cb:11,Fb:4,Bbb:10,"E#":5,"B#":0,Cx:2,Dx:4,Fx:7,Gx:9,Ax:11,Abb:7,Dbb:0,Ebb:2,Gbb:5 };
      const CHORD_INTERVALS = { bass: [0], major: [0, 4, 7], minor: [0, 3, 7], seventh: [0, 4, 7, 10], diminished: [0, 3, 6] };
      const roots = ["A#","D#","G#","C#","F#","B","E","A","D","G","C","F","Bb","Eb","Ab","Db","Gb","Cb","Fb","Bbb"];
      const rows = ["diminished","seventh","minor","major","bass","counterbass"];
      const rowNames = { diminished: "Dim", seventh: "7th", minor: "Minor", major: "Major", bass: "Bass", counterbass: "Counter" };
      const counterbassLabels = { "A#":"Cx", "D#":"Fx", "G#":"B#", "C#":"E#", "F#":"A#", B:"D#", E:"G#", A:"C#", D:"F#", G:"B", C:"E", F:"A", Bb:"D", Eb:"G", Ab:"C", Db:"F", Gb:"Bb", Cb:"Eb", Fb:"Ab", Bbb:"Db" };
      const chordLabels = { bass: r => r, counterbass: r => counterbassLabels[r] || r, major: r => r, minor: r => r + "m", seventh: r => r + "7", diminished: r => r + "dim" };
      const bassHeaderXOffset = -8;
      const bassHeaderYOffset = 12;
      const bassButtonXOffset = 2;
      const bassButtonYOffset = 26;
      const $ = id => document.getElementById(id);
      const textOf = (node, selector) => node?.querySelector(selector)?.textContent?.trim();
      const asNumber = (value, fallback) => Number.isFinite(Number(value)) ? Number(value) : fallback;
      const pitch = name => ({ name });
      const note = (id, name, duration, held = false) => ({ id, pitch: pitch(name), durationBeats: duration, isSustained: held });
      // ── Chord symbol → Stradella bass reduction ────────────────────
      // A Stradella board only has major / minor / dominant-7 / diminished
      // rows, so richer symbols are reduced to the closest playable button.
      // `approx` is true when the reduction dropped something, which lets the
      // UI show "Cmaj7 → C" instead of calling the chord unsupported.
      const SEMITONE_TO_ROOT = { 0:"C",1:"C#",2:"D",3:"Eb",4:"E",5:"F",6:"F#",7:"G",8:"Ab",9:"A",10:"Bb",11:"B" };
      const normalizeRoot = root => {
        if (roots.includes(root)) return root;
        const semi = NOTE_SEMITONES[root];
        return semi === undefined ? "" : SEMITONE_TO_ROOT[semi];
      };
      const normalizeChordSuffix = raw => String(raw || "")
        .replace(/[△Δ∆]/g, "maj7")
        .replace(/[øØ]/g, "m7b5")
        .replace(/[°º˚]/g, "dim")
        .replace(/[–—]/g, "-")
        .replace(/[()\s]/g, "");
      // Ordered; first match wins. [suffix pattern, Stradella row, approximated?]
      const CHORD_QUALITY_RULES = [
        [/^$/,                                          "major",      false],
        [/^(maj|major|Maj|M)$/,                         "major",      false],
        [/^(m|mi|min|minor|-)$/,                        "minor",      false],
        [/^7$/,                                         "seventh",    false],
        [/^(dim|dim7|o7)$/,                             "diminished", false],
        [/^(m|mi|min|-)?7b5$/,                          "diminished", true ],
        [/^(m|mi|min|-)(6|7|9|11|13|maj7|Maj7|M7|add\d*|b5|#5|sus\d*)/, "minor", true ],
        [/^(maj|Maj|M)(7|9|11|13)/,                     "major",      true ],
        [/^(6|69|6\/9|add\d*|2|4|5)$/,                  "major",      true ],
        [/^sus\d*$/,                                    "major",      true ],
        [/^(aug|\+)$/,                                  "major",      true ],
        [/^(aug7|\+7|7#5)/,                             "seventh",    true ],
        [/^(9|11|13|7sus\d*|7b9|7#9|7b5|7#11|7b13|alt|7alt)/, "seventh", true ]
      ];
      const parseChordQuality = raw => {
        const text = String(raw || "").replace(/♭/g, "b").replace(/♯/g, "#").trim();
        const none = { root: "", quality: "unknown", approx: false, bassRoot: "" };
        if (!text || /^(n\.?c\.?|no\s?chord)$/i.test(text)) return none;
        // Split a slash bass ("C/G") but leave compound suffixes like "6/9" alone.
        const slash = text.split("/");
        let head = text, bassRoot = "";
        if (slash.length === 2 && /^[A-G](?:#{1,2}|b{1,2}|x)?$/.test(slash[1].trim())) {
          head = slash[0];
          bassRoot = normalizeRoot(slash[1].trim());
        }
        const match = head.match(/^([A-G](?:#{1,2}|b{1,2}|x)?)(.*)$/);
        if (!match) return none;
        const root = normalizeRoot(match[1]);
        if (!root) return none;
        const suffix = normalizeChordSuffix(match[2]);
        for (const [pattern, quality, approx] of CHORD_QUALITY_RULES) {
          if (pattern.test(suffix)) return { root, quality, approx, bassRoot: bassRoot || root, raw: text };
        }
        return { root, quality: "unknown", approx: false, bassRoot: bassRoot || root, raw: text };
      };
      const isBassbeat = (beatNumber, beatsPerMeasure) =>
        beatsPerMeasure === 3 ? beatNumber === 1 : beatNumber % 2 === 1;
      const allChordButtons = raw => {
        const parsed = parseChordQuality(raw || "");
        if (parsed.quality === "unknown") return [];
        return [{ id: "bass-" + parsed.bassRoot }, { id: parsed.quality + "-" + parsed.root }];
      };
      // What actually gets played, e.g. "Cmaj7" -> "C", "Am7/E" -> "Am/E".
      const stradellaLabel = raw => {
        const parsed = parseChordQuality(raw || "");
        if (parsed.quality === "unknown") return "";
        const base = chordLabels[parsed.quality](parsed.root);
        return parsed.bassRoot && parsed.bassRoot !== parsed.root ? base + "/" + parsed.bassRoot : base;
      };
      const isApproxChord = raw => parseChordQuality(raw || "").approx === true;
      const selectChordButton = (raw, beatNumber, beatsPerMeasure) => {
        const parsed = parseChordQuality(raw || "");
        if (parsed.quality === "unknown") return { buttons: [], action: "none" };
        if (isBassbeat(beatNumber, beatsPerMeasure)) {
          return { buttons: [{ id: "bass-" + parsed.bassRoot, label: parsed.bassRoot }], action: "bass" };
        }
        return { buttons: [{ id: parsed.quality + "-" + parsed.root, label: chordLabels[parsed.quality](parsed.root) }], action: "chord" };
      };
      const chordWarnings = raw => raw && !allChordButtons(raw).length ? [`Unsupported chord symbol: ${raw}`] : [];
      const buildBeat = (id, measureNumber, beatNumber, notes, chord, beatsPerMeasure = 4, warnings = []) => {
        const { buttons, action } = chord ? selectChordButton(chord, beatNumber, beatsPerMeasure) : { buttons: [], action: "none" };
        const startingNotes = notes.filter(n => !n.isSustained);
        const noteOnsets = startingNotes.length ? [{ posInBeat: 0, notes: startingNotes }] : [];
        return { id, measureNumber, beatNumber, beatsPerMeasure, noteOnsets, activeRightHandNotes: notes, startingRightHandNotes: startingNotes, chordSymbol: chord ? { raw: chord } : undefined, activeLeftHandButtons: buttons, leftHandAction: action, warnings: warnings.concat(chordWarnings(chord)) };
      };
      const sampleEvents = [
        buildBeat("m1-b1", 1, 1, [note("c4","C4",2), note("e4","E4",1), note("g4","G4",1)], "C", 4),
        buildBeat("m1-b2", 1, 2, [note("c4h","C4",1,true)], "C", 4),
        buildBeat("m1-b3", 1, 3, [note("f4","F4",2), note("a4","A4",1)], "Dm", 4),
        buildBeat("m1-b4", 1, 4, [note("f4h","F4",1,true)], "Dm", 4),
        buildBeat("m2-b1", 2, 1, [note("e5","E5",1)], "G7", 4),
        buildBeat("m2-b2", 2, 2, [note("g5","G5",1)], "G7", 4),
        buildBeat("m2-b3", 2, 3, [note("fs4","F#4",2)], "Bbdim", 4),

        let html = rows.map((row, rowIndex) => `<text class="row-label" x="${bassHeaderXOffset + rowIndex * 34}" y="${bassHeaderYOffset + 16}">${rowNames[row]}</text>`).join("");
        rows.forEach((row, rowIndex) => roots.forEach((root, columnIndex) => {
          const x = bassButtonXOffset + rowIndex * 34, y = bassButtonYOffset + 34 + columnIndex * 27 + rowIndex * 13, id = row + "-" + root, label = splitLabel(chordLabels[row](root));
          html += `<g><circle class="bass-button" data-bid="${id}" cx="${x}" cy="${y}" r="11"></circle><text class="button-label" x="${x}" y="${y + 3}">${label[0]}${label[1] ? `<tspan x="${x}" dy="6" class="button-label-suffix">${label[1]}</tspan>` : ""}</text></g>`;
        }));
        $("bass").innerHTML = html;
        bassButtonEls = new Map();
        $("bass").querySelectorAll("[data-bid]").forEach(el => bassButtonEls.set(el.getAttribute("data-bid"), el));
      }
      function renderBass(beat) {
        if (!bassButtonEls) buildBassSvg();
        activeBassButtons.forEach(el => el.classList.remove("is-active-bass", "is-active-chord"));
        activeBassButtons = [];
        const activeClass = beat.leftHandAction === "bass" ? "is-active-bass" : beat.leftHandAction === "chord" ? "is-active-chord" : "";
        if (!activeClass) return;
        beat.activeLeftHandButtons.forEach(button => {
          const el = bassButtonEls.get(button.id);
          if (el) { el.classList.add(activeClass); activeBassButtons.push(el); }
        });
      }
      let noteSound = false;
      let bassSound = false;
      $("notesound").onchange = () => { noteSound = $("notesound").checked; };
      $("basssound").onchange = () => { bassSound = $("basssound").checked; };

      // Every voice goes through one master gain (so stacked notes cannot clip)
      // and takes an absolute audio-clock time, which is what lets autoplay queue
      // sound ahead of the beat instead of firing it from a timer.
      function scheduleVoice(ctx, freq, when, peak, decay, type) {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain); gain.connect(masterGain);
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(peak, when);
        gain.gain.exponentialRampToValueAtTime(0.0001, when + decay);
        osc.start(when);
        osc.stop(when + decay + 0.01);
      }
      function playBassButtonSound(beat, when) {
        const button = beat.activeLeftHandButtons[0];
        if (!button) return;
        try {
          const ctx = getAudioCtx();
          const match = button.id.match(/^([^-]+)-(.+)$/);
          if (!match) return;
          const intervals = CHORD_INTERVALS[match[1]];
          const rootSemi = NOTE_SEMITONES[match[2]];
          if (!intervals || rootSemi === undefined) return;
          const baseMidi = 12 * 5 + rootSemi;
          const at = Math.max(when ?? ctx.currentTime, ctx.currentTime);
          intervals.forEach(interval =>
            scheduleVoice(ctx, 440 * Math.pow(2, (baseMidi + interval - 69) / 12), at, 0.25, 0.7, "triangle"));
        } catch (_) {}
      }
      const sharpSpelling = name => name.replace(/^Db/, "C#").replace(/^Eb/, "D#").replace(/^Gb/, "F#").replace(/^Ab/, "G#").replace(/^Bb/, "A#");
      function noteToFreq(pitchName) {
        const match = pitchName.match(/^([A-G][b#]?)(\d)$/);
        if (!match) return null;
        const semi = NOTE_SEMITONES[match[1]];
        if (semi === undefined) return null;
        return 440 * Math.pow(2, (12 * (Number(match[2]) + 1) + semi - 69) / 12);
      }
      function playNoteChord(notes, when) {
        try {
          const ctx = getAudioCtx();
          const at = Math.max(when ?? ctx.currentTime, ctx.currentTime);
          notes.forEach(n => {
            const freq = noteToFreq(sharpSpelling(n.pitch.name));
            if (freq) scheduleVoice(ctx, freq, at, 0.18, 0.55, "triangle");
          });
        } catch (_) {}
      }

      let noteAnimTimer = null;
      function clearNoteAnim() {
        if (noteAnimTimer) { clearTimeout(noteAnimTimer); noteAnimTimer = null; }
      }
      function animateOnsets(beat, idx) {
        const onsets = beat.noteOnsets || [];
        if (idx >= onsets.length) return;
        const onset = onsets[idx];
        // at first onset, show ALL active notes (new + held); subsequent onsets show only new notes
        const displayNotes = idx === 0 ? beat.activeRightHandNotes : onset.notes;
        renderPiano(new Set(displayNotes.map(n => sharpSpelling(n.pitch.name))));
        // During autoplay the notes are already queued on the audio clock, so
        // only manual stepping makes sound here.
        if (noteSound && !playing) playNoteChord(displayNotes);
        if (idx + 1 < onsets.length) {
          const gap = onsets[idx + 1].posInBeat - onset.posInBeat;
          // The floor only guards against a zero-length timer. It must stay well
          // under the real sub-beat gap, otherwise fast passages (four
          // sixteenths at 200 BPM) overrun the beat they belong to.
          const delay = Math.max(16, gap * (60000 / bpm));
          noteAnimTimer = setTimeout(() => animateOnsets(beat, idx + 1), delay);
        }
      }
      let lastWarningsHtml = null;
      function render() {
        clearNoteAnim();
        const beat = events[index] || sampleEvents[0];
        const beatLabel = `Beat ${beat.beatNumber}`;
        $("measure").textContent = `Measure ${beat.measureNumber}`;
        $("beat").textContent = beatLabel;
        $("count").textContent = `${index + 1} / ${events.length}`;
        $("score-position").textContent = `Measure ${beat.measureNumber}, ${beatLabel}`;
        $("prev").disabled = index === 0;
        $("next").disabled = index === events.length - 1;
        updateScoreHighlight();
        animateOnsets(beat, 0);
        renderBass(beat);
        if (bassSound && !playing) playBassButtonSound(beat);
        const button = beat.activeLeftHandButtons[0];
        const actionColor = beat.leftHandAction === "bass" ? "#49c6a3" : beat.leftHandAction === "chord" ? "#ffd166" : "transparent";
        const actionLabel = beat.leftHandAction === "bass" ? "Bass note" : beat.leftHandAction === "chord" ? "Chord button" : "—";
        const raw = beat.chordSymbol?.raw || "";
        const played = raw ? stradellaLabel(raw) : "";
        $("info-position").textContent = `Measure ${beat.measureNumber}, ${beatLabel} / ${beat.beatsPerMeasure ?? 4}`;
        $("info-chord").innerHTML = raw
          ? `${raw}${played && played !== raw ? `<span class="chord-approx">→ ${played}</span>` : ""}`
          : "None";
        $("info-lefthand").innerHTML = `<span style="display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;font-weight:700;background:${actionColor};color:#1a2420">${actionLabel}</span>${button ? ` <strong>${button.label}</strong>` : ""}`;
        $("info-righthand").textContent = beat.activeRightHandNotes.map(n => n.pitch.name + (n.isSustained ? " (held)" : "")).join(", ") || "Rest";
        const warnings = globalWarnings.concat(beat.warnings);
        const html = warnings.length ? `<div class="warnings-panel"><h4>Warnings</h4><ul>${warnings.map(w => `<li>${w}</li>`).join("")}</ul></div>` : "";
        if (html !== lastWarningsHtml) { $("warnings").innerHTML = html; lastWarningsHtml = html; }
      }
      // ── Autoplay / Metronome ──────────────────────────────────
      // Timing comes from the Web Audio clock, not from setTimeout. A 25 ms
      // scheduler tick queues every beat falling inside the next 120 ms directly
      // on the audio clock, so the metronome cannot accumulate drift no matter
      // how long a render takes. A requestAnimationFrame loop then flips the
      // visuals as the audio clock passes each queued beat, which keeps the
      // diagram in step with what you hear instead of racing it.
      let bpm = 80;
      let playing = false;
      let audioCtx = null;
      let masterGain = null;
      const LOOKAHEAD_SECONDS = 0.12;
      const SCHEDULER_TICK_MS = 25;
      const START_DELAY_SECONDS = 0.06;
      let schedulerTimer = null;
      let visualFrame = null;
      let nextBeatIndex = 0;
      let nextBeatTime = 0;
      let beatQueue = [];

      const secondsPerBeat = () => 60 / bpm;

      function getAudioCtx() {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          masterGain = audioCtx.createGain();
          masterGain.gain.value = 0.85;
          masterGain.connect(audioCtx.destination);
        }
        if (audioCtx.state === "suspended") audioCtx.resume();
        return audioCtx;
      }

      function playClick(strong, when) {
        try {
          const ctx = getAudioCtx();
          const at = Math.max(when ?? ctx.currentTime, ctx.currentTime);
          scheduleVoice(ctx, strong ? 1050 : 750, at, strong ? 0.45 : 0.28, 0.08, "sine");
        } catch (_) {}
      }

      function flashBeat(strong) {
        const dot = $("beat-flash");
        dot.classList.remove("strong", "weak");
        dot.classList.add(strong ? "strong" : "weak");
        setTimeout(() => dot.classList.remove("strong", "weak"), 120);
      }

      // Queue one beat's audio - click, bass button, and each sub-beat note
      // onset - at exact offsets from that beat's start time.
      function scheduleBeatAudio(beatIndex, when) {
        const beat = events[beatIndex];
        if (!beat) return;
        playClick(beat.beatNumber === 1, when);
        if (bassSound) playBassButtonSound(beat, when);
        if (noteSound) {
          const spb = secondsPerBeat();
          (beat.noteOnsets || []).forEach((onset, i) => {
            playNoteChord(i === 0 ? beat.activeRightHandNotes : onset.notes, when + onset.posInBeat * spb);
          });
        }
      }

      function schedulerTick() {
        if (!playing) return;
        const ctx = getAudioCtx();
        // A backgrounded tab throttles setInterval to about 1 Hz, so the tick
        // can wake up long after the beats it owed. Resync rather than firing
        // every missed beat at once.
        if (nextBeatTime < ctx.currentTime - 0.25) nextBeatTime = ctx.currentTime + 0.02;
        while (nextBeatIndex < events.length && nextBeatTime < ctx.currentTime + LOOKAHEAD_SECONDS) {
          scheduleBeatAudio(nextBeatIndex, nextBeatTime);
          beatQueue.push({ index: nextBeatIndex, time: nextBeatTime });
          // Reading the tempo here means a BPM change takes hold within one
          // lookahead window, with no re-anchoring required.
          nextBeatTime += secondsPerBeat();
          nextBeatIndex++;
        }
      }

      function visualTick() {
        if (!playing) { visualFrame = null; return; }
        const now = getAudioCtx().currentTime;
        let due = -1;
        while (beatQueue.length && beatQueue[0].time <= now) due = beatQueue.shift().index;
        if (due >= 0) {
          index = due;
          flashBeat(events[index]?.beatNumber === 1);
          render();
        }
        if (!beatQueue.length && nextBeatIndex >= events.length) { stopAutoplay(); return; }
        visualFrame = requestAnimationFrame(visualTick);
      }

      function startAutoplay() {
        if (!events.length) return;
        const ctx = getAudioCtx();
        playing = true;
        $("playbtn").textContent = "⏹ Stop";
        $("playbtn").classList.add("is-playing");
        clearNoteAnim();
        beatQueue = [];
        nextBeatIndex = index;
        nextBeatTime = ctx.currentTime + START_DELAY_SECONDS;
        schedulerTick();
        schedulerTimer = setInterval(schedulerTick, SCHEDULER_TICK_MS);
        visualFrame = requestAnimationFrame(visualTick);
      }

      function stopAutoplay() {
        playing = false;
        if (schedulerTimer) { clearInterval(schedulerTimer); schedulerTimer = null; }
        if (visualFrame) { cancelAnimationFrame(visualFrame); visualFrame = null; }
        beatQueue = [];
        clearNoteAnim();
        $("playbtn").textContent = "▶ Play";
        $("playbtn").classList.remove("is-playing");
      }

      $("playbtn").onclick = () => { playing ? stopAutoplay() : startAutoplay(); };

      $("bpmslider").oninput = () => {
        bpm = Math.min(200, Math.max(20, Number($("bpmslider").value)));
        $("bpmnum").value = bpm;
      };
      $("bpmnum").oninput = () => {
        bpm = Math.min(200, Math.max(20, Number($("bpmnum").value) || bpm));
        $("bpmslider").value = bpm;
      };
      // ───────────────────────────────────────────────────────────────────

      $("prev").onclick = () => { stopAutoplay(); index = Math.max(0, index - 1); render(); };
      $("next").onclick = () => { stopAutoplay(); index = Math.min(events.length - 1, index + 1); render(); };
      document.addEventListener("keydown", e => {
        if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
        if (e.key === "ArrowRight") { e.preventDefault(); stopAutoplay(); index = Math.min(events.length - 1, index + 1); render(); }
        else if (e.key === "ArrowLeft") { e.preventDefault(); stopAutoplay(); index = Math.max(0, index - 1); render(); }
        else if (e.key === " ") { e.preventDefault(); playing ? stopAutoplay() : startAutoplay(); }
        else if (e.key === "Home") { e.preventDefault(); stopAutoplay(); index = 0; render(); }
        else if (e.key === "End") { e.preventDefault(); stopAutoplay(); index = events.length - 1; render(); }
      });
      // ── Score loading ──────────────────────────────────────
      let currentXmlText = null;
      let manualChordText = "";

      function populatePartSelector(parsed) {
        const sel = $("melody-part");
        if (!parsed.parts || parsed.parts.length < 2) { sel.style.display = "none"; sel.innerHTML = ""; return; }
        sel.innerHTML = parsed.parts.map(part =>
          `<option value="${part.index}">${part.name} (${part.noteCount} notes)</option>`).join("");
        sel.value = String(parsed.melodyIndex);
        sel.style.display = "";
      }

      // "Am | Am | Dm E7 | Am" - one group per measure; the chords in a group are
      // spread evenly across that measure's beats. "-" holds the previous chord.
      function applyChordOverride(list, text) {
        const groups = String(text || "").split("|").map(part => part.trim()).filter(Boolean);
        if (!groups.length || !list.length) return [];
        const measureNums = [...new Set(list.map(e => e.measureNumber))];
        const byMeasure = new Map();
        measureNums.forEach((num, i) => { if (i < groups.length) byMeasure.set(num, groups[i].split(/\s+/).filter(Boolean)); });
        let carried = "";
        list.forEach(e => {
          const slots = byMeasure.get(e.measureNumber);
          if (!slots || !slots.length) return;
          const beats = e.beatsPerMeasure || 4;
          const slot = Math.min(slots.length - 1, Math.floor((e.beatNumber - 1) * slots.length / beats));
          const chord = /^[-.]+$/.test(slots[slot]) ? carried : slots[slot];
          if (!chord) return;
          carried = chord;
          const { buttons, action } = selectChordButton(chord, e.beatNumber, beats);
          e.chordSymbol = { raw: chord };
          e.activeLeftHandButtons = buttons;
          e.leftHandAction = action;
          e.warnings = (e.warnings || [])
            .filter(w => !/No chord symbol detected|Unsupported chord symbol/.test(w))
            .concat(chordWarnings(chord));
        });
        const notes = [];
        if (groups.length !== measureNums.length) notes.push(`Chord override covers ${groups.length} measure(s); the score has ${measureNums.length}.`);
        const unknown = [...new Set(groups.join(" ").split(/\s+/)
          .filter(chord => chord && !/^[-.]+$/.test(chord) && !allChordButtons(chord).length))];
        if (unknown.length) notes.push("Unrecognized chords in the override: " + unknown.join(", ") + ".");
        return notes;
      }

      function adoptParse(parsed, xmlText, header) {
        if (!parsed.events.length) { globalWarnings = header.concat(parsed.warnings); return false; }
        stopAutoplay();
        currentXmlText = xmlText;
        events = parsed.events;
        index = 0;
        lastScrollRowY = -1;
        const overrideWarnings = applyChordOverride(events, manualChordText);
        globalWarnings = header.concat(parsed.warnings, overrideWarnings);
        populatePartSelector(parsed);
        return true;
      }

      // Re-run the parser on the score already loaded - used when the melody
      // part or the manual chord override changes. The rendered score stays put.
      function reparseCurrent() {
        if (!currentXmlText) { render(); return; }
        const selected = Number($("melody-part").value);
        const parsed = parseMusicXml(currentXmlText, Number.isFinite(selected) ? selected : 0);
        if (adoptParse(parsed, currentXmlText, [])) buildBeatOverlay();
        render();
      }

      $("melody-part").onchange = reparseCurrent;
      $("chord-apply").onclick = () => { manualChordText = $("chord-input").value.trim(); reparseCurrent(); };
      $("chord-clear").onclick = () => { $("chord-input").value = ""; manualChordText = ""; reparseCurrent(); };
      $("chord-input").onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); $("chord-apply").click(); } };

      $("sample").onclick = () => {
        const parsed = parseMusicXml(SAMPLE_XML);
        if (adoptParse(parsed, SAMPLE_XML, ["Sample score loaded."])) loadScoreIntoOSMD(SAMPLE_XML);
        else { stopAutoplay(); events = sampleEvents; index = 0; }
        render();
      };

      async function convertPdf(file) {
        const body = new FormData();
        body.append("score", file);
        const response = await fetch("http://localhost:8787/api/omr", { method: "POST", body });
        const result = await response.json();
        if (!response.ok || !result.musicXml) {
          return { parsed: null, xmlText: null, warnings: [...(result.warnings || []), result.details || result.error || "OMR conversion failed."] };
        }
        return { parsed: parseMusicXml(result.musicXml), xmlText: result.musicXml, warnings: result.warnings || [] };
      }

      $("file").onchange = async e => {
        const file = e.target.files[0];
        if (!file) return;
        const name = file.name.toLowerCase();
        const scoreName = file.name.replace(/\.[^.]+$/, "");
        if (name.endsWith(".pdf")) {
          globalWarnings = [`PDF uploaded: ${file.name}`, "Converting with local OMR server..."];
          render();
          try {
            const converted = await convertPdf(file);
            if (converted.parsed && adoptParse(converted.parsed, converted.xmlText, [`PDF converted: ${file.name}`, ...converted.warnings])) {
              loadScoreIntoOSMD(converted.xmlText);
              saveScore(scoreName, converted.xmlText).then(populateSavedScores).catch(() => {});
            } else {
              globalWarnings = [`PDF uploaded: ${file.name}`, ...converted.warnings];
            }
          } catch {
            globalWarnings = [`PDF uploaded: ${file.name}`, "Start the local OMR server with npm run omr:server and configure AUDIVERIS_CMD to enable PDF recognition."];
          }
          render();
          return;
        }
        if (name.endsWith(".mxl")) { globalWarnings = ["Compressed .mxl upload is recognized, but archive decompression is not implemented in this preview. Export uncompressed .musicxml or .xml."]; render(); return; }
        if (!name.endsWith(".xml") && !name.endsWith(".musicxml")) { globalWarnings = ["Unsupported file type. Use .musicxml, .xml, .mxl, or .pdf."]; render(); return; }
        const reader = new FileReader();
        reader.onload = () => {
          const xmlText = String(reader.result || "");
          const parsed = parseMusicXml(xmlText);
          if (adoptParse(parsed, xmlText, [`MusicXML loaded: ${file.name}`])) {
            loadScoreIntoOSMD(xmlText);
            saveScore(scoreName, xmlText).then(populateSavedScores).catch(() => {});
          }
          render();
        };
        reader.readAsText(file);
      };

      $("saved-scores").onchange = async () => {
        const id = parseInt($("saved-scores").value);
        if (!id) { $("delete-score").style.display = "none"; return; }
        $("delete-score").style.display = "";
        try {
          const record = await loadScore(id);
          if (!record) return;
          const parsed = parseMusicXml(record.xml);
          if (adoptParse(parsed, record.xml, [`Loaded: ${record.name}`])) loadScoreIntoOSMD(record.xml);
          render();
        } catch (err) {
          globalWarnings = ["Failed to load saved score: " + err.message];
          render();
        }
      };

      $("delete-score").onclick = async () => {
        const id = parseInt($("saved-scores").value);
        if (!id) return;
        await deleteScore(id);
        await populateSavedScores();
      };
      populateSavedScores();
      render();
    </script>
  </body>
</html>
